[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qview"
version = "1.0.0"
authors = [
  { name = "Shobhit Shah", email = "shobhitsd@github.com" },
]
description = "Enterprise Post-Quantum Cryptography (PQC) Discovery, CBOM Generation & Quantum Risk Governance Platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "cryptography>=41.0.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
qview = "cli:main"

[tool.setuptools.packages.find]
include = ["core*", "scanners*"]
exclude = ["api*", "web*", "public*", "sample_data*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = "test_*.py"
