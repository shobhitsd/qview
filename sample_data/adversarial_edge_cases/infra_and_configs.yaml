# Infrastructure as Code & Network Config Edge Cases
# Tests Kubernetes Secrets, Nginx Ingress SSL Ciphers, and TLS Protocol Downgrades

apiVersion: v1
kind: Secret
metadata:
  name: payment-tls-secret
  namespace: production
type: kubernetes.io/tls
data:
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...
  # Hardcoded Base64 Private Key
  tls.key: LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktLS0tLQpNSUlFcEFJQkFBS0NBUUVBMEtQMVB3...

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy-api-ingress
  annotations:
    # Deprecated TLS protocols (TLSv1.0 & TLSv1.1)
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1 TLSv1.1 TLSv1.2"
    # Insecure cipher suites: RC4, 3DES, CBC mode ciphers
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA:RC4-SHA:DES-CBC3-SHA"
spec:
  rules:
  - host: api.legacy.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: legacy-service
            port:
              number: 443
